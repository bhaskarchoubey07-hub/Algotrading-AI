[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrade-ai-starter"
version = "0.1.0"
description = "Paper-only modular algorithmic trading research scaffold"
requires-python = ">=3.11"

[tool.poetry]
package-mode = false

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "streamlit>=1.35,<2.0",
  "plotly>=5.20,<8.0",
  "scikit-learn>=1.4,<2.0",
  "scipy>=1.13,<2.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
